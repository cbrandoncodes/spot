[package]
name = "spot-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"

[lib]
name = "spot_backend"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
better-auth = { git = "https://github.com/better-auth-rs/better-auth-rs", rev = "23c89f4e51999fe5767804879c82c60249cf9f84", default-features = false, features = [
    "axum",
    "rustls",
    "seaorm2",
] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
garde = { version = "0.23", features = ["derive"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sea-orm = { version = "=2.0.0-rc.37", default-features = false, features = [
    "macros",
    "runtime-tokio-rustls",
    "sqlx-postgres",
    "with-chrono",
    "with-json",
    "with-uuid",
] }
# Derive output and runtime traits must stay on the same SeaORM prerelease.
sea-orm-macros = "=2.0.0-rc.37"
sea-orm-migration = { version = "=2.0.0-rc.37", default-features = false, features = [
    "runtime-tokio-rustls",
    "sqlx-postgres",
] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["serde", "v7"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
